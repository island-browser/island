<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#F3F0E9">
    <meta name="robots" content="noindex">
    <title>Page not found — Island</title>
    <style>
      :root {
        color-scheme: light dark;
      }

      body {
        display: grid;
        min-height: 100dvh;
        place-items: center;
        margin: 0;
        padding: 24px;
        background: #F3F0E9;
        color: #18303A;
        font: 400 16px/1.55 Geist, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        max-width: 580px;
        text-align: center;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 96px;
        color: #18303A;
        font-weight: 650;
        letter-spacing: -.02em;
        text-decoration: none;
      }

      .brand svg {
        width: 26px;
        height: 26px;
        fill: #168C99;
      }

      .eyebrow {
        margin: 0 0 16px;
        color: #18303A;
        font: 600 12px/1.4 "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: .08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 24px;
        font-size: clamp(40px, 6vw, 72px);
        font-weight: 500;
        letter-spacing: -.055em;
        line-height: .98;
      }

      p:not(.eyebrow) {
        margin: 0 0 24px;
      }

      .button {
        display: inline-flex;
        min-height: 48px;
        align-items: center;
        gap: 8px;
        padding: 12px 16px;
        border-radius: 8px;
        background: #18303A;
        color: #FFFEFB;
        font-size: 14px;
        font-weight: 650;
        text-decoration: none;
      }

      a:focus-visible {
        outline: 3px solid #168C99;
        outline-offset: 4px;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #0D1B26;
          color: #EAF3F3;
        }

        .brand, .eyebrow {
          color: #EAF3F3;
        }

        .button {
          background: #EAF3F3;
          color: #142633;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <a class="brand" href="https://github.com/impelixx/island" aria-label="Island repository on GitHub">
        <svg aria-hidden="true" viewBox="0 0 32 32">
          <path d="M5 20.5c3.2-1.1 5.3-4.2 6.2-9.4 3.5 1.9 5.5 5 6 9.4 3.6-1 6.7-.5 9.8 1.8-4.7 4.3-13.7 5.3-22 1.1Z"/>
        </svg>
        <span>Island</span>
      </a>
      <p class="eyebrow">404</p>
      <h1>Nothing is open here.</h1>
      <p>That page has moved, or it was never part of this space.</p>
      <a class="button" href="https://github.com/impelixx/island">View the project <span aria-hidden="true">→</span></a>
    </main>
  </body>
</html>
