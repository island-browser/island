name: Deploy site to GitHub Pages

on:
  # The one automatic trigger kept while the others are paused: a single cheap
  # job that publishes the site whenever main changes what it shows.
  push:
    branches:
      - main
    paths:
      - site/**
      - CHANGELOG.md
      - VERSION
      - scripts/version.py
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out static site
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Check the site matches VERSION and CHANGELOG
        shell: bash
        run: python3 scripts/version.py check
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - name: Upload static site only
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: site
      - id: deployment
        name: Deploy Pages artifact
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
