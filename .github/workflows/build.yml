name: Native build

on:
  pull_request:
    paths:
      - CMakeLists.txt
      - deps/**
      - scripts/**
      - src/**
      - tests/**
      - .github/workflows/build.yml
  push:
    branches:
      - main
    paths:
      - CMakeLists.txt
      - deps/**
      - scripts/**
      - src/**
      - tests/**
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  verify-matrix:
    name: Verify native target matrix
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify all native platform interfaces and locked CEF targets
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          targets = json.loads(Path("deps/dependencies.lock.json").read_text())["dependencies"]["cef"]["targets"]
          expected_targets = {
              "macosx64", "macosarm64", "windows64", "windowsarm64", "linux64", "linuxarm64"
          }
          required_paths = {
              "cmake/platform/windows.cmake",
              "cmake/platform/linux.cmake",
              "src/main/main_mac.mm",
              "src/main/windows/main_win.cc",
              "src/main/linux/main_linux.cc",
          }
          assert set(targets) == expected_targets, "dependency manifest must lock exactly six desktop targets"
          missing = sorted(path for path in required_paths if not Path(path).is_file())
          assert not missing, f"missing native platform interfaces: {', '.join(missing)}"
          print("All six locked desktop targets have native platform source interfaces.")
          PY

  build-and-test:
    name: ${{ matrix.target }} (${{ matrix.sandbox-mode }})
    needs: verify-matrix
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macosx64
            runner: macos-13
            python: python3
            setup-shell: bash
            sandbox-mode: default
            configure-argument: ''
          - target: macosarm64
            runner: macos-14
            python: python3
            setup-shell: bash
            sandbox-mode: default
            configure-argument: ''
          - target: windows64
            runner: windows-2022
            python: python
            setup-shell: pwsh
            sandbox-mode: sandbox-off
            configure-argument: -DUSE_SANDBOX=OFF
          - target: windows64
            runner: windows-2022
            python: python
            setup-shell: pwsh
            sandbox-mode: sandbox-on
            configure-argument: -DUSE_SANDBOX=ON
          - target: windowsarm64
            runner: windows-11-arm
            python: python
            setup-shell: pwsh
            sandbox-mode: sandbox-off
            configure-argument: -DUSE_SANDBOX=OFF
          - target: windowsarm64
            runner: windows-11-arm
            python: python
            setup-shell: pwsh
            sandbox-mode: sandbox-on
            configure-argument: -DUSE_SANDBOX=ON
          - target: linux64
            runner: ubuntu-24.04
            python: python3
            setup-shell: bash
            sandbox-mode: default
            configure-argument: ''
          - target: linuxarm64
            runner: ubuntu-24.04-arm
            python: python3
            setup-shell: bash
            sandbox-mode: default
            configure-argument: ''
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - id: cache-key-bash
        name: Derive dependency cache key (Bash)
        if: ${{ matrix.setup-shell == 'bash' }}
        shell: bash
        run: echo "value=$(${{ matrix.python }} scripts/deps.py print-cache-key --target '${{ matrix.target }}')" >> "$GITHUB_OUTPUT"
      - id: cache-key-pwsh
        name: Derive dependency cache key (PowerShell)
        if: ${{ matrix.setup-shell == 'pwsh' }}
        shell: pwsh
        run: '"value=$(& ${{ matrix.python }} scripts/deps.py print-cache-key --target ''${{ matrix.target }}'')" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append'
      - name: Restore verified CEF and font dependencies
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            third_party/cef
            assets/fonts
          key: ${{ steps.cache-key-bash.outputs.value || steps.cache-key-pwsh.outputs.value }}-${{ matrix.sandbox-mode }}
      - name: Install and verify dependencies (Bash)
        if: ${{ matrix.setup-shell == 'bash' }}
        shell: bash
        run: ./scripts/setup_deps.sh --target '${{ matrix.target }}'
      - name: Install and verify dependencies (PowerShell)
        if: ${{ matrix.setup-shell == 'pwsh' }}
        shell: pwsh
        run: '& .\scripts\setup_deps.ps1 --target ''${{ matrix.target }}'''
      - name: Configure
        run: cmake -S . -B build-${{ matrix.target }}-${{ matrix.sandbox-mode }} ${{ matrix.configure-argument }}
      - name: Build
        run: cmake --build build-${{ matrix.target }}-${{ matrix.sandbox-mode }} --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build-${{ matrix.target }}-${{ matrix.sandbox-mode }} --output-on-failure -C Release
      - name: Upload failed CMake diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cmake-diagnostics-${{ matrix.target }}-${{ matrix.sandbox-mode }}
          path: build-${{ matrix.target }}-${{ matrix.sandbox-mode }}/CMakeFiles
          if-no-files-found: ignore
          retention-days: 7
