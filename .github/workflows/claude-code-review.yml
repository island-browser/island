name: Claude Code Review

on:
  # Automatic triggers are paused: builds and tests run locally to save
  # GitHub Actions minutes. Restore the triggers from git history to re-enable.
  workflow_dispatch:

jobs:
  claude-review:
    # Don't review Claude's own pull requests. Claude-authored branches are
    # reviewed by a human before merge, so an automated review of them adds
    # noise rather than signal.
    #
    # Both halves are needed: the PR can be opened by the app (user.type is
    # Bot), or opened by a human and then pushed to by the app, which makes
    # claude[bot] the triggering actor on the synchronize event. Skipping is
    # deliberate rather than removing allowed_bots below -- an unguarded bot
    # run fails the action outright and shows up as a red check, whereas an
    # unmet job condition is reported as skipped.
    if: >-
      github.event.pull_request.user.type != 'Bot' &&
      github.triggering_actor != 'claude[bot]' &&
      github.triggering_actor != 'claude'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # PRs on this repo are frequently pushed by the Claude GitHub App,
          # which makes claude[bot] the triggering actor. The action refuses
          # non-human actors unless they are allow-listed. Scoped to this one
          # bot on purpose: '*' would let any external App invoke the action
          # with a prompt it controls on a public repository.
          allowed_bots: 'claude[bot]'
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

