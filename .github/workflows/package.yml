name: Package unsigned candidates

on:
  push:
    branches:
      - main
    paths:
      - CMakeLists.txt
      - cmake/**
      - deps/**
      - scripts/**
      - src/**
      - tests/**
      - .github/workflows/package.yml
  workflow_dispatch:
    inputs:
      candidate_version:
        description: Optional SemVer candidate version; defaults to this CI run's version.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: package-candidate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  prepare-candidate:
    name: Prepare candidate version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - id: version
        name: Select explicit candidate version
        shell: bash
        env:
          CANDIDATE_VERSION: ${{ inputs.candidate_version }}
        run: |
          version="${CANDIDATE_VERSION:-}"
          if [ -z "$version" ]; then
            version="0.0.0-ci.${GITHUB_RUN_NUMBER}"
          fi
          python3 - "$version" <<'PY'
          import re
          import sys

          pattern = r"^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$"
          if re.fullmatch(pattern, sys.argv[1]) is None:
              raise SystemExit(f"candidate version is not SemVer-like: {sys.argv[1]!r}")
          PY
          echo "value=$version" >> "$GITHUB_OUTPUT"

  package:
    name: ${{ matrix.target }}
    needs: prepare-candidate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macosx64
            runner: macos-13
            python: python3
            setup-shell: bash
            configure-argument: ''
          - target: macosarm64
            runner: macos-14
            python: python3
            setup-shell: bash
            configure-argument: ''
          - target: windows64
            runner: windows-2022
            python: python
            setup-shell: pwsh
            configure-argument: -DUSE_SANDBOX=ON
          - target: windowsarm64
            runner: windows-11-arm
            python: python
            setup-shell: pwsh
            configure-argument: -DUSE_SANDBOX=ON
          - target: linux64
            runner: ubuntu-24.04
            python: python3
            setup-shell: bash
            configure-argument: ''
          - target: linuxarm64
            runner: ubuntu-24.04-arm
            python: python3
            setup-shell: bash
            configure-argument: ''
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - id: cache-key-bash
        name: Derive dependency cache key (Bash)
        if: ${{ matrix.setup-shell == 'bash' }}
        shell: bash
        run: echo "value=$(${{ matrix.python }} scripts/deps.py print-cache-key --target '${{ matrix.target }}')" >> "$GITHUB_OUTPUT"
      - id: cache-key-pwsh
        name: Derive dependency cache key (PowerShell)
        if: ${{ matrix.setup-shell == 'pwsh' }}
        shell: pwsh
        run: '"value=$(& ${{ matrix.python }} scripts/deps.py print-cache-key --target ''${{ matrix.target }}'')" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append'
      - name: Restore verified CEF and font dependencies
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            third_party/cef
            assets/fonts
          key: ${{ steps.cache-key-bash.outputs.value || steps.cache-key-pwsh.outputs.value }}
      - name: Install and verify dependencies (Bash)
        if: ${{ matrix.setup-shell == 'bash' }}
        shell: bash
        run: ./scripts/setup_deps.sh --target '${{ matrix.target }}'
      - name: Install and verify dependencies (PowerShell)
        if: ${{ matrix.setup-shell == 'pwsh' }}
        shell: pwsh
        run: '& .\scripts\setup_deps.ps1 --target ''${{ matrix.target }}'''
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.configure-argument }}
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure -C Release
      - name: Package and verify candidate (Bash)
        if: ${{ matrix.setup-shell == 'bash' }}
        shell: bash
        env:
          CANDIDATE_VERSION: ${{ needs.prepare-candidate.outputs.version }}
          PACKAGE_BUILD_DIR: build
          PACKAGE_TARGET: ${{ matrix.target }}
          PYTHON_EXECUTABLE: ${{ matrix.python }}
        run: |
          "$PYTHON_EXECUTABLE" scripts/package.py --target "$PACKAGE_TARGET" --build-dir "$PACKAGE_BUILD_DIR" --version "$CANDIDATE_VERSION" --output-dir dist
          "$PYTHON_EXECUTABLE" - "$PACKAGE_TARGET" "$CANDIDATE_VERSION" <<'PY'
          import hashlib
          import json
          import sys
          import tarfile
          import zipfile
          from pathlib import Path

          target, version = sys.argv[1:]
          sums = Path("dist/SHA256SUMS.txt").read_text(encoding="utf-8").strip().split(maxsplit=1)
          assert len(sums) == 2, "SHA256SUMS must contain one digest and artifact name"
          expected_digest, name = sums
          artifact = Path("dist") / name
          assert artifact.is_file(), f"missing candidate artifact: {artifact}"
          assert hashlib.sha256(artifact.read_bytes()).hexdigest() == expected_digest, "artifact SHA-256 mismatch"
          if name.endswith(".zip"):
              expected_format = "zip"
              with zipfile.ZipFile(artifact) as archive:
                  metadata = json.loads(archive.read("build-metadata.json"))
          elif name.endswith(".tar.gz"):
              expected_format = "tar.gz"
              with tarfile.open(artifact, "r:gz") as archive:
                  member = archive.extractfile("build-metadata.json")
                  assert member is not None, "missing build metadata"
                  metadata = json.load(member)
          else:
              raise AssertionError(f"unsupported candidate archive extension: {name}")
          assert metadata == {"format": expected_format, "notarized": False, "publicReleaseEligible": False, "signed": False, "target": target, "version": version}
          PY
      - name: Package and verify candidate (PowerShell)
        if: ${{ matrix.setup-shell == 'pwsh' }}
        shell: pwsh
        env:
          CANDIDATE_VERSION: ${{ needs.prepare-candidate.outputs.version }}
          PACKAGE_BUILD_DIR: build
          PACKAGE_TARGET: ${{ matrix.target }}
          PYTHON_EXECUTABLE: ${{ matrix.python }}
        run: |
          & $env:PYTHON_EXECUTABLE scripts/package.py --target $env:PACKAGE_TARGET --build-dir $env:PACKAGE_BUILD_DIR --version $env:CANDIDATE_VERSION --output-dir dist
          if ($env:PACKAGE_TARGET -like "windows*") {
            if (-not (Test-Path (Join-Path $env:PACKAGE_BUILD_DIR "Release/island_browser.dll"))) {
              throw "Windows sandbox package is missing island_browser.dll"
            }
          }
          @'
          import hashlib
          import json
          import os
          import sys
          import tarfile
          import zipfile
          from pathlib import Path

          target = os.environ["PACKAGE_TARGET"]
          version = os.environ["CANDIDATE_VERSION"]
          sums = Path("dist/SHA256SUMS.txt").read_text(encoding="utf-8").strip().split(maxsplit=1)
          assert len(sums) == 2, "SHA256SUMS must contain one digest and artifact name"
          expected_digest, name = sums
          artifact = Path("dist") / name
          assert artifact.is_file(), f"missing candidate artifact: {artifact}"
          assert hashlib.sha256(artifact.read_bytes()).hexdigest() == expected_digest, "artifact SHA-256 mismatch"
          if name.endswith(".zip"):
              expected_format = "zip"
              with zipfile.ZipFile(artifact) as archive:
                  metadata = json.loads(archive.read("build-metadata.json"))
                  if target.startswith("windows"):
                      assert "island_browser.dll" in archive.namelist(), "missing Windows sandbox DLL"
          elif name.endswith(".tar.gz"):
              expected_format = "tar.gz"
              with tarfile.open(artifact, "r:gz") as archive:
                  member = archive.extractfile("build-metadata.json")
                  assert member is not None, "missing build metadata"
                  metadata = json.load(member)
          else:
              raise AssertionError(f"unsupported candidate archive extension: {name}")
          assert metadata == {"format": expected_format, "notarized": False, "publicReleaseEligible": False, "signed": False, "target": target, "version": version}
          '@ | & $env:PYTHON_EXECUTABLE -
      - name: Upload unsigned candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unsigned-candidate-${{ needs.prepare-candidate.outputs.version }}-${{ matrix.target }}
          path: dist
          if-no-files-found: error
          retention-days: 7
      - name: Upload failed CMake diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: package-diagnostics-${{ matrix.target }}
          path: build/CMakeFiles
          if-no-files-found: ignore
          retention-days: 7
