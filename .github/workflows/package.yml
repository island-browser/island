name: Package unsigned candidates

on:
  # build-release.yml calls this on pushes to main (all six targets, then it publishes).
  # Dispatching it directly builds and uploads candidates without publishing anything.
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full 40-character commit SHA reachable from main.
        required: true
        type: string
      version:
        description: Package version (SemVer, no build metadata). Empty means <VERSION>-ci.<run number>.
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      commit_sha:
        description: Full 40-character commit SHA reachable from main.
        required: true
        type: string
      version:
        description: Package version (SemVer, no build metadata). Empty means <VERSION>-ci.<run number>.
        required: false
        type: string
        default: ''
    outputs:
      sha:
        description: The packaged commit.
        value: ${{ jobs.prepare-candidate.outputs.sha }}
      version:
        description: The version in every archive name and build-metadata.json.
        value: ${{ jobs.prepare-candidate.outputs.version }}

permissions:
  contents: read

concurrency:
  group: package-candidate-${{ inputs.commit_sha }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  prepare-candidate:
    name: Resolve candidate commit and version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      version: ${{ steps.commit.outputs.version }}
    steps:
      - name: Check out main history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - id: commit
        name: Resolve exact candidate commit
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.commit_sha }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          sha="$CANDIDATE_SHA"
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'commit_sha must be a full 40-character SHA.' >&2
            exit 1
          fi
          GIT_MASTER=1 git cat-file -e "$sha^{commit}"
          GIT_MASTER=1 git merge-base --is-ancestor "$sha" origin/main
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [ -n "$REQUESTED_VERSION" ]; then
            # scripts/package.py's SEMVER minus build metadata ("+" is awkward in asset URLs).
            # Validated here because later steps interpolate the version into shell commands.
            semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
            if ! [[ "$REQUESTED_VERSION" =~ $semver ]]; then
              echo "version must be SemVer without build metadata, got '$REQUESTED_VERSION'." >&2
              exit 1
            fi
            echo "version=$REQUESTED_VERSION" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="$(git show "$sha:VERSION" 2>/dev/null | tr -d '[:space:]' || true)"
          base="${base%%-*}"
          echo "version=${base:-0.0.0}-ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

  package-macos:
    name: ${{ matrix.target }}
    needs: prepare-candidate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macosx64
            runner: macos-15-intel
            architecture: x86_64
          - target: macosarm64
            runner: macos-15
            architecture: arm64
    steps:
      - name: Check out resolved candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare-candidate.outputs.sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-logs
          python3 scripts/deps.py install --target '${{ matrix.target }}' 2>&1 | tee ci-logs/install-${{ matrix.target }}.log
      - name: Verify dependency receipt
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-logs
          python3 scripts/deps.py verify 2>&1 | tee ci-logs/verify-${{ matrix.target }}.log | tee dependency-receipt.txt
      - name: Configure Release build
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-logs
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES='${{ matrix.architecture }}' 2>&1 | tee ci-logs/configure-${{ matrix.target }}.log
      - name: Build Release target
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-logs
          cmake --build build --config Release --parallel 2 2>&1 | tee ci-logs/build-${{ matrix.target }}.log
      - name: Run native tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-logs
          ctest --test-dir build -C Release --output-on-failure --no-tests=error \
            --output-junit junit.xml 2>&1 | tee ci-logs/test-${{ matrix.target }}.log
      - name: Ad-hoc sign the app bundle
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/installers.py macos-sign build/src/main/island_browser.app 2>&1 | tee sign.log
      - name: Package and verify candidate
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/package.py --target '${{ matrix.target }}' --build-dir build \
            --version '${{ needs.prepare-candidate.outputs.version }}' --output-dir dist 2>&1 | tee package.log
          python3 - '${{ matrix.target }}' '${{ needs.prepare-candidate.outputs.version }}' <<'PY'
          import hashlib
          import json
          import sys
          import tarfile
          import zipfile
          from pathlib import Path

          target, version = sys.argv[1:]
          digest, name = Path("dist/SHA256SUMS.txt").read_text(encoding="utf-8").strip().split(maxsplit=1)
          artifact = Path("dist") / name
          assert artifact.is_file()
          assert hashlib.sha256(artifact.read_bytes()).hexdigest() == digest
          with zipfile.ZipFile(artifact) as archive:
              metadata = json.loads(archive.read("build-metadata.json"))
          assert metadata == {"format": "zip", "notarized": False, "publicReleaseEligible": False, "signed": False, "target": target, "version": version}
          PY
      - name: Build the disk image
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/installers.py build --target '${{ matrix.target }}' \
            --version '${{ needs.prepare-candidate.outputs.version }}' --output-dir dist \
            --app build/src/main/island_browser.app 2>&1 | tee installer.log
          (cd dist && shasum -a 256 -c SHA256SUMS.txt)
      - name: Upload unsigned candidate
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: unsigned-candidate-${{ needs.prepare-candidate.outputs.version }}-${{ matrix.target }}
          path: dist
          if-no-files-found: error
          retention-days: 30
      - name: Upload target diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: package-diagnostics-${{ matrix.target }}
          path: |
            ci-logs/**
            dependency-receipt.txt
            package.log
            sign.log
            installer.log
            junit.xml
            build/CMakeCache.txt
          if-no-files-found: warn
          retention-days: 7

  package-linux:
    name: ${{ matrix.target }}
    needs: prepare-candidate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux64
            runner: ubuntu-24.04
          - target: linuxarm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out resolved candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare-candidate.outputs.sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install native prerequisites
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-logs
          sudo apt-get update 2>&1 | tee ci-logs/install-${{ matrix.target }}.log
          sudo apt-get install --no-install-recommends --yes fontconfig libfontconfig1-dev \
            libgtk-3-dev libnss3-dev libasound2-dev pkg-config xvfb 2>&1 | tee -a ci-logs/install-${{ matrix.target }}.log
      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-logs
          python3 scripts/deps.py install --target '${{ matrix.target }}' 2>&1 | tee -a ci-logs/install-${{ matrix.target }}.log
      - name: Verify dependency receipt
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-logs
          python3 scripts/deps.py verify 2>&1 | tee ci-logs/verify-${{ matrix.target }}.log | tee dependency-receipt.txt
      - name: Configure Release build
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-logs
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release 2>&1 | tee ci-logs/configure-${{ matrix.target }}.log
      - name: Build Release target
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-logs
          cmake --build build --config Release --parallel 2 2>&1 | tee ci-logs/build-${{ matrix.target }}.log
      - name: Run native tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-logs
          # island_cef_tests calls CefInitialize, which needs an X11 display even for
          # tests that never open a visible window.
          xvfb-run -a ctest --test-dir build -C Release --output-on-failure --no-tests=error \
            --output-junit junit.xml 2>&1 | tee ci-logs/test-${{ matrix.target }}.log
      - name: Package and verify candidate
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/package.py --target '${{ matrix.target }}' --build-dir build \
            --version '${{ needs.prepare-candidate.outputs.version }}' --output-dir dist 2>&1 | tee package.log
          python3 - '${{ matrix.target }}' '${{ needs.prepare-candidate.outputs.version }}' <<'PY'
          import hashlib
          import json
          import sys
          import tarfile
          from pathlib import Path

          target, version = sys.argv[1:]
          digest, name = Path("dist/SHA256SUMS.txt").read_text(encoding="utf-8").strip().split(maxsplit=1)
          artifact = Path("dist") / name
          assert artifact.is_file()
          assert hashlib.sha256(artifact.read_bytes()).hexdigest() == digest
          with tarfile.open(artifact, "r:gz") as archive:
              member = archive.extractfile("build-metadata.json")
              assert member is not None
              metadata = json.load(member)
          assert metadata == {"format": "tar.gz", "notarized": False, "publicReleaseEligible": False, "signed": False, "target": target, "version": version}
          PY
      - name: Build the Debian package
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/installers.py build --target '${{ matrix.target }}' \
            --version '${{ needs.prepare-candidate.outputs.version }}' --output-dir dist 2>&1 | tee installer.log
          (cd dist && sha256sum -c SHA256SUMS.txt)
      - name: Upload unsigned candidate
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: unsigned-candidate-${{ needs.prepare-candidate.outputs.version }}-${{ matrix.target }}
          path: dist
          if-no-files-found: error
          retention-days: 30
      - name: Upload target diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: package-diagnostics-${{ matrix.target }}
          path: |
            ci-logs/**
            dependency-receipt.txt
            package.log
            sign.log
            installer.log
            junit.xml
            build/CMakeCache.txt
          if-no-files-found: warn
          retention-days: 7

  package-windows:
    name: ${{ matrix.target }}
    needs: prepare-candidate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows64
            runner: windows-2022
            platform: x64
          - target: windowsarm64
            runner: windows-11-arm
            platform: ARM64
    steps:
      - name: Check out resolved candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare-candidate.outputs.sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path ci-logs | Out-Null
          python scripts/deps.py install --target '${{ matrix.target }}' 2>&1 | Tee-Object -FilePath ci-logs/install-${{ matrix.target }}.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify dependency receipt
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path ci-logs | Out-Null
          python scripts/deps.py verify 2>&1 | Tee-Object -FilePath ci-logs/verify-${{ matrix.target }}.log | Tee-Object -FilePath dependency-receipt.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Configure Release build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path ci-logs | Out-Null
          # Runner images move between Visual Studio releases (windows-11-arm no
          # longer ships VS 2022), so pick the generator of the installed one.
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsVersion = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 Microsoft.VisualStudio.Component.VC.Tools.ARM64 -requiresAny -property installationVersion
          $generator = switch -Regex ($vsVersion) {
            '^17\.' { 'Visual Studio 17 2022' }
            '^18\.' { 'Visual Studio 18 2026' }
            default { throw "No supported Visual Studio with C++ tools found (vswhere reported '$vsVersion')." }
          }
          Write-Host "Using $generator ($vsVersion) with $(cmake --version | Select-Object -First 1)"
          cmake -S . -B build -G $generator -A '${{ matrix.platform }}' -DUSE_SANDBOX=ON 2>&1 | Tee-Object -FilePath ci-logs/configure-${{ matrix.target }}.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Release target
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path ci-logs | Out-Null
          cmake --build build --config Release --parallel 2 2>&1 | Tee-Object -FilePath ci-logs/build-${{ matrix.target }}.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run native tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path ci-logs | Out-Null
          ctest --test-dir build -C Release --output-on-failure --no-tests=error --output-junit junit.xml 2>&1 | Tee-Object -FilePath ci-logs/test-${{ matrix.target }}.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package and verify candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/package.py --target '${{ matrix.target }}' --build-dir build --version '${{ needs.prepare-candidate.outputs.version }}' --output-dir dist 2>&1 | Tee-Object -FilePath package.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @'
          import hashlib
          import json
          import sys
          import zipfile
          from pathlib import Path

          target = "${{ matrix.target }}"
          version = "${{ needs.prepare-candidate.outputs.version }}"
          digest, name = Path("dist/SHA256SUMS.txt").read_text(encoding="utf-8").strip().split(maxsplit=1)
          artifact = Path("dist") / name
          assert artifact.is_file()
          assert hashlib.sha256(artifact.read_bytes()).hexdigest() == digest
          with zipfile.ZipFile(artifact) as archive:
              assert "island_browser.dll" in archive.namelist()
              metadata = json.loads(archive.read("build-metadata.json"))
          assert metadata == {"format": "zip", "notarized": False, "publicReleaseEligible": False, "signed": False, "target": target, "version": version}
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build the setup program
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Inno Setup ships on windows-2022; install it where the image lacks it.
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe", "$env:ProgramFiles\Inno Setup *\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) {
            if (Get-Command choco -ErrorAction SilentlyContinue) {
              choco install innosetup --yes --no-progress
            } else {
              Invoke-WebRequest -Uri 'https://jrsoftware.org/download.php/is.exe' -OutFile "$env:RUNNER_TEMP\innosetup.exe"
              Start-Process -Wait -FilePath "$env:RUNNER_TEMP\innosetup.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/ALLUSERS'
            }
          }
          python scripts/installers.py build --target '${{ matrix.target }}' --version '${{ needs.prepare-candidate.outputs.version }}' --output-dir dist 2>&1 | Tee-Object -FilePath installer.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content dist/SHA256SUMS.txt | ForEach-Object {
            $digest, $name = $_ -split '\s+', 2
            $actual = (Get-FileHash -Algorithm SHA256 "dist/$name").Hash.ToLowerInvariant()
            if ($actual -ne $digest) { throw "checksum mismatch for $name" }
          }
      - name: Upload unsigned candidate
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: unsigned-candidate-${{ needs.prepare-candidate.outputs.version }}-${{ matrix.target }}
          path: dist
          if-no-files-found: error
          retention-days: 30
      - name: Upload target diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: package-diagnostics-${{ matrix.target }}
          path: |
            ci-logs/**
            dependency-receipt.txt
            package.log
            sign.log
            installer.log
            junit.xml
            build/CMakeCache.txt
          if-no-files-found: warn
          retention-days: 7
