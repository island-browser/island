name: Package unsigned candidates

on:
  workflow_run:
    workflows:
      - Island CI
    branches:
      - main
    types:
      - completed
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full 40-character commit SHA reachable from main.
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: package-candidate-${{ github.event.workflow_run.head_sha || inputs.commit_sha }}
  cancel-in-progress: false

jobs:
  prepare-candidate:
    name: Resolve successful CI commit
    if: >-
      github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      version: ${{ steps.commit.outputs.version }}
    steps:
      - name: Check out main history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0
      - id: commit
        name: Resolve exact candidate commit
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_SHA: ${{ inputs.commit_sha }}
          UPSTREAM_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          sha="$UPSTREAM_SHA"
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            sha="$MANUAL_SHA"
            if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo 'commit_sha must be a full 40-character SHA.' >&2
              exit 1
            fi
          fi
          GIT_MASTER=1 git cat-file -e "$sha^{commit}"
          GIT_MASTER=1 git merge-base --is-ancestor "$sha" origin/main
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=0.0.0-ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

  package-macos:
    name: ${{ matrix.target }}
    needs: prepare-candidate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macosx64
            runner: macos-15-intel
            architecture: x86_64
          - target: macosarm64
            runner: macos-15
            architecture: arm64
    steps:
      - name: Check out resolved candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.prepare-candidate.outputs.sha }}
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-logs
          python3 scripts/deps.py install --target '${{ matrix.target }}' 2>&1 | tee ci-logs/install-${{ matrix.target }}.log
      - name: Verify dependency receipt
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-logs
          python3 scripts/deps.py verify 2>&1 | tee ci-logs/verify-${{ matrix.target }}.log | tee dependency-receipt.txt
      - name: Configure Release build
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-logs
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES='${{ matrix.architecture }}' 2>&1 | tee ci-logs/configure-${{ matrix.target }}.log
      - name: Build Release target
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-logs
          cmake --build build --config Release --parallel 2 2>&1 | tee ci-logs/build-${{ matrix.target }}.log
      - name: Run native tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-logs
          ctest --test-dir build -C Release --output-on-failure --no-tests=error \
            --output-junit junit.xml 2>&1 | tee ci-logs/test-${{ matrix.target }}.log
      - name: Package and verify candidate
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/package.py --target '${{ matrix.target }}' --build-dir build \
            --version '${{ needs.prepare-candidate.outputs.version }}' --output-dir dist 2>&1 | tee package.log
          python3 - '${{ matrix.target }}' '${{ needs.prepare-candidate.outputs.version }}' <<'PY'
          import hashlib
          import json
          import sys
          import tarfile
          import zipfile
          from pathlib import Path

          target, version = sys.argv[1:]
          digest, name = Path("dist/SHA256SUMS.txt").read_text(encoding="utf-8").strip().split(maxsplit=1)
          artifact = Path("dist") / name
          assert artifact.is_file()
          assert hashlib.sha256(artifact.read_bytes()).hexdigest() == digest
          with zipfile.ZipFile(artifact) as archive:
              metadata = json.loads(archive.read("build-metadata.json"))
          assert metadata == {"format": "zip", "notarized": False, "publicReleaseEligible": False, "signed": False, "target": target, "version": version}
          PY
      - name: Upload unsigned candidate
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unsigned-candidate-${{ needs.prepare-candidate.outputs.version }}-${{ matrix.target }}
          path: dist
          if-no-files-found: error
          retention-days: 30
      - name: Upload target diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: package-diagnostics-${{ matrix.target }}
          path: |
            ci-logs/**
            dependency-receipt.txt
            package.log
            junit.xml
            build/CMakeCache.txt
          if-no-files-found: warn
          retention-days: 7

  package-linux:
    name: ${{ matrix.target }}
    needs: prepare-candidate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux64
            runner: ubuntu-24.04
          - target: linuxarm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out resolved candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.prepare-candidate.outputs.sha }}
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install native prerequisites
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-logs
          sudo apt-get update 2>&1 | tee ci-logs/install-${{ matrix.target }}.log
          sudo apt-get install --no-install-recommends --yes fontconfig libfontconfig1-dev \
            libgtk-3-dev libnss3-dev libasound2-dev pkg-config 2>&1 | tee -a ci-logs/install-${{ matrix.target }}.log
      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-logs
          python3 scripts/deps.py install --target '${{ matrix.target }}' 2>&1 | tee -a ci-logs/install-${{ matrix.target }}.log
      - name: Verify dependency receipt
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-logs
          python3 scripts/deps.py verify 2>&1 | tee ci-logs/verify-${{ matrix.target }}.log | tee dependency-receipt.txt
      - name: Configure Release build
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-logs
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release 2>&1 | tee ci-logs/configure-${{ matrix.target }}.log
      - name: Build Release target
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-logs
          cmake --build build --config Release --parallel 2 2>&1 | tee ci-logs/build-${{ matrix.target }}.log
      - name: Run native tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-logs
          ctest --test-dir build -C Release --output-on-failure --no-tests=error \
            --output-junit junit.xml 2>&1 | tee ci-logs/test-${{ matrix.target }}.log
      - name: Package and verify candidate
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/package.py --target '${{ matrix.target }}' --build-dir build \
            --version '${{ needs.prepare-candidate.outputs.version }}' --output-dir dist 2>&1 | tee package.log
          python3 - '${{ matrix.target }}' '${{ needs.prepare-candidate.outputs.version }}' <<'PY'
          import hashlib
          import json
          import sys
          import tarfile
          from pathlib import Path

          target, version = sys.argv[1:]
          digest, name = Path("dist/SHA256SUMS.txt").read_text(encoding="utf-8").strip().split(maxsplit=1)
          artifact = Path("dist") / name
          assert artifact.is_file()
          assert hashlib.sha256(artifact.read_bytes()).hexdigest() == digest
          with tarfile.open(artifact, "r:gz") as archive:
              member = archive.extractfile("build-metadata.json")
              assert member is not None
              metadata = json.load(member)
          assert metadata == {"format": "tar.gz", "notarized": False, "publicReleaseEligible": False, "signed": False, "target": target, "version": version}
          PY
      - name: Upload unsigned candidate
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unsigned-candidate-${{ needs.prepare-candidate.outputs.version }}-${{ matrix.target }}
          path: dist
          if-no-files-found: error
          retention-days: 30
      - name: Upload target diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: package-diagnostics-${{ matrix.target }}
          path: |
            ci-logs/**
            dependency-receipt.txt
            package.log
            junit.xml
            build/CMakeCache.txt
          if-no-files-found: warn
          retention-days: 7

  package-windows:
    name: ${{ matrix.target }}
    needs: prepare-candidate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows64
            runner: windows-2022
            platform: x64
          - target: windowsarm64
            runner: windows-11-arm
            platform: ARM64
    steps:
      - name: Check out resolved candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.prepare-candidate.outputs.sha }}
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path ci-logs | Out-Null
          python scripts/deps.py install --target '${{ matrix.target }}' 2>&1 | Tee-Object -FilePath ci-logs/install-${{ matrix.target }}.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify dependency receipt
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path ci-logs | Out-Null
          python scripts/deps.py verify 2>&1 | Tee-Object -FilePath ci-logs/verify-${{ matrix.target }}.log | Tee-Object -FilePath dependency-receipt.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Configure Release build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path ci-logs | Out-Null
          cmake -S . -B build -G 'Visual Studio 17 2022' -A '${{ matrix.platform }}' -DUSE_SANDBOX=ON 2>&1 | Tee-Object -FilePath ci-logs/configure-${{ matrix.target }}.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Release target
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path ci-logs | Out-Null
          cmake --build build --config Release --parallel 2 2>&1 | Tee-Object -FilePath ci-logs/build-${{ matrix.target }}.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run native tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path ci-logs | Out-Null
          ctest --test-dir build -C Release --output-on-failure --no-tests=error --output-junit junit.xml 2>&1 | Tee-Object -FilePath ci-logs/test-${{ matrix.target }}.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package and verify candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/package.py --target '${{ matrix.target }}' --build-dir build --version '${{ needs.prepare-candidate.outputs.version }}' --output-dir dist 2>&1 | Tee-Object -FilePath package.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @'
          import hashlib
          import json
          import sys
          import zipfile
          from pathlib import Path

          target = "${{ matrix.target }}"
          version = "${{ needs.prepare-candidate.outputs.version }}"
          digest, name = Path("dist/SHA256SUMS.txt").read_text(encoding="utf-8").strip().split(maxsplit=1)
          artifact = Path("dist") / name
          assert artifact.is_file()
          assert hashlib.sha256(artifact.read_bytes()).hexdigest() == digest
          with zipfile.ZipFile(artifact) as archive:
              assert "island_browser.dll" in archive.namelist()
              metadata = json.loads(archive.read("build-metadata.json"))
          assert metadata == {"format": "zip", "notarized": False, "publicReleaseEligible": False, "signed": False, "target": target, "version": version}
          '@ | python -
      - name: Upload unsigned candidate
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unsigned-candidate-${{ needs.prepare-candidate.outputs.version }}-${{ matrix.target }}
          path: dist
          if-no-files-found: error
          retention-days: 30
      - name: Upload target diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: package-diagnostics-${{ matrix.target }}
          path: |
            ci-logs/**
            dependency-receipt.txt
            package.log
            junit.xml
            build/CMakeCache.txt
          if-no-files-found: warn
          retention-days: 7
