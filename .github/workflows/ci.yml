name: Island CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: island-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  portable:
    name: Portable checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check dependency setup shell syntax
        shell: bash
        run: bash -n scripts/setup_deps.sh
      - name: Check dependency setup dry run
        shell: bash
        run: ./scripts/setup_deps.sh --dry-run
      - name: Run dependency unit tests
        shell: bash
        run: python3 -m unittest discover -s tests/deps -p 'test_*.py'
      - name: Run package unit tests
        shell: bash
        run: python3 -m unittest tests.package.test_package tests.package.test_package_resources
      - name: Verify committed icons
        shell: bash
        run: tools/icon_pipeline/run.sh verify

  native-macos:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macosx64
            runner: macos-15-intel
            architecture: x86_64
          - target: macosarm64
            runner: macos-15
            architecture: arm64
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install dependencies
        shell: bash
        run: python3 scripts/deps.py install --target '${{ matrix.target }}'
      - name: Verify dependency receipt
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/deps.py verify 2>&1 | tee dependency-receipt.txt
      - name: Configure Release build
        shell: bash
        run: |
          set -o pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES='${{ matrix.architecture }}' 2>&1 | tee configure.log
      - name: Build Release target
        shell: bash
        run: |
          set -o pipefail
          cmake --build build --config Release --parallel 2 2>&1 | tee build.log
      - name: Run native tests
        shell: bash
        run: |
          set -o pipefail
          ctest --test-dir build -C Release --output-on-failure --no-tests=error \
            --output-junit junit.xml 2>&1 | tee test.log
      - name: Upload target diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-diagnostics-${{ matrix.target }}
          path: |
            dependency-receipt.txt
            configure.log
            build.log
            test.log
            junit.xml
            build/CMakeCache.txt
          if-no-files-found: warn
          retention-days: 7

  native-linux:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux64
            runner: ubuntu-24.04
          - target: linuxarm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install native prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes fontconfig libfontconfig1-dev \
            libgtk-3-dev libnss3-dev libasound2-dev pkg-config
      - name: Install dependencies
        shell: bash
        run: python3 scripts/deps.py install --target '${{ matrix.target }}'
      - name: Verify dependency receipt
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/deps.py verify 2>&1 | tee dependency-receipt.txt
      - name: Configure Release build
        shell: bash
        run: |
          set -o pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release 2>&1 | tee configure.log
      - name: Build Release target
        shell: bash
        run: |
          set -o pipefail
          cmake --build build --config Release --parallel 2 2>&1 | tee build.log
      - name: Run native tests
        shell: bash
        run: |
          set -o pipefail
          ctest --test-dir build -C Release --output-on-failure --no-tests=error \
            --output-junit junit.xml 2>&1 | tee test.log
      - name: Upload target diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-diagnostics-${{ matrix.target }}
          path: |
            dependency-receipt.txt
            configure.log
            build.log
            test.log
            junit.xml
            build/CMakeCache.txt
          if-no-files-found: warn
          retention-days: 7

  native-windows:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows64
            runner: windows-2022
            platform: x64
          - target: windowsarm64
            runner: windows-11-arm
            platform: ARM64
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install dependencies
        shell: pwsh
        run: python scripts/deps.py install --target '${{ matrix.target }}'
      - name: Verify dependency receipt
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/deps.py verify 2>&1 | Tee-Object -FilePath dependency-receipt.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Configure Release build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S . -B build -G 'Visual Studio 17 2022' -A '${{ matrix.platform }}' -DUSE_SANDBOX=ON 2>&1 | Tee-Object -FilePath configure.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Release target
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake --build build --config Release --parallel 2 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run native tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ctest --test-dir build -C Release --output-on-failure --no-tests=error --output-junit junit.xml 2>&1 | Tee-Object -FilePath test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload target diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-diagnostics-${{ matrix.target }}
          path: |
            dependency-receipt.txt
            configure.log
            build.log
            test.log
            junit.xml
            build/CMakeCache.txt
          if-no-files-found: warn
          retention-days: 7

  ci-success:
    name: ci-success
    if: always()
    needs:
      - portable
      - native-macos
      - native-linux
      - native-windows
    runs-on: ubuntu-24.04
    steps:
      - name: Require every CI job to succeed
        shell: bash
        run: |
          test '${{ needs.portable.result }}' = success
          test '${{ needs.native-macos.result }}' = success
          test '${{ needs.native-linux.result }}' = success
          test '${{ needs.native-windows.result }}' = success
