name: Island Search

on:
  # Automatic triggers are paused: builds and tests run locally to save
  # GitHub Actions minutes. Restore the triggers from git history to re-enable.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: island-search-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  search-native:
    name: search ${{ matrix.target }}
    # Six native targets per run. Dependabot here only bumps GitHub Actions
    # versions, so skip the matrix on its pull requests.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macosarm64
            runner: macos-15
            cmake_arguments: ''
          - target: macosx64
            runner: macos-15-intel
            cmake_arguments: -DCMAKE_OSX_ARCHITECTURES=x86_64
          - target: linux64
            runner: ubuntu-24.04
            cmake_arguments: ''
          - target: linuxarm64
            runner: ubuntu-24.04-arm
            cmake_arguments: ''
          - target: windows64
            runner: windows-2022
            cmake_arguments: -A x64
          - target: windowsarm64
            runner: windows-11-arm
            cmake_arguments: -A ARM64
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Configure search build
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-logs
          # Configure src/search as its own source root: the search kernel is
          # CEF-free, and its standalone mode keeps cmake away from the root
          # CEF/font/icon sentinels of the browser build.
          cmake -S src/search -B build-search -DCMAKE_BUILD_TYPE=Release \
            -DISLAND_ENABLE_SEARCH=ON ${{ matrix.cmake_arguments }} \
            2>&1 | tee ci-logs/configure-${{ matrix.target }}.log
      - name: Build search targets
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-logs
          cmake --build build-search --config Release --parallel 2 \
            --target island_search --target island_search_tests \
            --target island_search_posting_codec_harness \
            --target search_membench \
            2>&1 | tee ci-logs/build-${{ matrix.target }}.log
      - name: Run search tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-logs
          ctest --test-dir build-search -C Release --output-on-failure --no-tests=error \
            --output-junit junit.xml 2>&1 | tee ci-logs/test-${{ matrix.target }}.log

      - name: Run the search memory gate
        shell: bash
        # Only the budget verdict is non-blocking. The S0 design targets a
        # 32 MB RSS delta at 100k documents and the kernel currently measures
        # 2.1-2.9x that across the six targets, so exit 1 (over the ceiling) is downgraded to a
        # warning: a blocking budget would make every pull request red for a
        # reason unrelated to its own changes. Everything else fails the job --
        # a missing binary, bad arguments or a failed index operation (2), or
        # a failed RSS sample (3) -- because none of those is a measurement.
        # Drop the exit-1 allowance in the same change that brings the delta
        # under the ceiling -- see docs/search-phase-s0-membench.md.
        run: |
          set -o pipefail
          mkdir -p ci-logs
          # Multi-config generators (MSVC) put the binary under a per-config
          # subdirectory; single-config ones do not. Resolve both rather than
          # assuming, so the Windows targets do not silently skip the gate.
          bench=""
          for candidate in build-search/bench/search_membench \
                           build-search/bench/Release/search_membench \
                           build-search/bench/search_membench.exe \
                           build-search/bench/Release/search_membench.exe; do
            if [ -x "$candidate" ]; then bench="$candidate"; break; fi
          done
          if [ -z "$bench" ]; then
            echo "search_membench binary not found under build-search/bench" >&2
            exit 1
          fi
          status=0
          "$bench" --ceiling-bytes 33554432 2>&1 \
            | tee ci-logs/membench-${{ matrix.target }}.log || status=$?
          if [ "$status" -eq 1 ]; then
            echo "::warning title=search memory gate ${{ matrix.target }}::RSS delta is over the 32 MB S0 ceiling (non-blocking until the budget is met)"
            exit 0
          fi
          exit "$status"
      - name: Annotate target failure
        if: failure()
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          WORKSPACE: ${{ github.workspace }}
        run: |
          python3 - "$TARGET" "$WORKSPACE" <<'PY'
          import re
          import sys
          from pathlib import Path

          target, workspace = sys.argv[1:]
          logs = [Path(f"ci-logs/{stage}-{target}.log") for stage in ("configure", "build", "test", "membench")]
          pattern = re.compile(r"CMake Error|fatal error|(?:^|\s)error:|undefined reference|linker|LNK\d+", re.I)
          lines = [line.strip() for log in logs if log.is_file() for line in log.read_text(errors="replace").splitlines()]
          selected = [line for line in lines if pattern.search(line)][:20] or lines[-20:]
          message = " | ".join(selected)[:4000] or "No target stage log was produced."
          workspace_prefixes = {workspace.rstrip("/\\") + "/", workspace.rstrip("/\\") + "\\"}
          for prefix in workspace_prefixes:
              message = message.replace(prefix, "")
          message = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=search {target} build diagnostic::{message}")
          PY
      - name: Upload target diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: search-diagnostics-${{ matrix.target }}
          path: |
            ci-logs/**
            junit.xml
            build-search/CMakeCache.txt
          if-no-files-found: warn
          retention-days: 7
