name: Dependency check

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  report:
    name: Check ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        target:
          - macosx64
          - macosarm64
          - windows64
          - windowsarm64
          - linux64
          - linuxarm64
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Generate immutable dependency report
        shell: bash
        run: |
          python3 scripts/deps.py check-updates --target '${{ matrix.target }}' | tee dependency-report.txt
          {
            echo "## Dependency check: ${{ matrix.target }}"
            echo
            echo '```text'
            cat dependency-report.txt
            echo '```'
            echo
            echo "This workflow is report-only: it never changes the lock file or opens/merges a pull request."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Retain dependency report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dependency-report-${{ matrix.target }}
          path: dependency-report.txt
          retention-days: 14
