name: Portable container tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-container-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  portable-container:
    name: Portable tests in locked image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Verify image lock digest pinning
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "
          import json, sys
          lock = json.loads(open('docker/images.lock.json').read())
          for name, record in lock['images'].items():
              digest = record['manifestDigest']
              if not digest.startswith('sha256:'):
                  print(f'error: {name} manifestDigest is not pinned by digest: {digest}', file=sys.stderr)
                  sys.exit(1)
          print('All image digests are pinned.')
          "
      - name: Build portable-tests image
        shell: bash
        run: |
          set -euo pipefail
          docker build --target portable-tests -t island-portable-tests:locked -f docker/Dockerfile .
      - name: Run portable tests in locked image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/container-artifacts build/reports
          docker run --rm \
            --network=none \
            --user="$(id -u):$(id -g)" \
            --workdir=/work \
            --mount="type=bind,source=$(pwd),target=/src,readonly" \
            --mount="type=volume,source=island-work-${{ github.run_id }},target=/work" \
            --mount="type=bind,source=$(pwd)/build/container-artifacts,target=/work/out" \
            island-portable-tests:locked \
            python3 -m unittest discover -s /src/tests/deps -p 'test_*.py'
      - name: Run container routing tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests/container -p 'test_*.py'
      - name: Upload container diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: portable-container-diagnostics
          path: |
            build/reports/**
            build/container-artifacts/**
          if-no-files-found: warn
          retention-days: 7
