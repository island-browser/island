<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Island</title>
<style>
/* The Native look's tokens (spec section 2.1). Before the first state arrives the page follows
   the system scheme; once the app sends its theme, data-theme wins so the page matches the app. */
:root {
  --bg: #EBEBEF; --surface: #FFFFFF; --surface-2: #F6F6F8; --fill: #E8E8ED; --text: #1D1D1F;
  --text-2: #636366; --text-3: #8E8E93; --border: #E5E5EA; --border-2: #D2D2D7; --accent: #0A64D8;
  --selection: #0A64D8; --accent-soft: #DFE9F8; --accent-text: #0A4FA8; --warn-bg: #FFF8E6;
  --warn-border: #F5D38A; --warn-text: #6A4A00; --success: #248A3D; --danger: #D70015;
  --segment-selected: #E3E3E8; --segment-outline: transparent;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme]) {
    --bg: #2A2A2D; --surface: #1E1E20; --surface-2: #252527; --fill: #3A3A3D; --text: #F5F5F7;
    --text-2: #98989D; --text-3: #6E6E73; --border: #38383A; --border-2: #48484A; --accent: #0A84FF;
    --selection: #0A6FE0; --accent-soft: #16324F; --accent-text: #64B5FF; --warn-bg: #3A2E12;
    --warn-border: #6B5420; --warn-text: #FFD60A; --success: #30D158; --danger: #FF453A;
    --segment-selected: #3A3A3D; --segment-outline: #48484A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #2A2A2D; --surface: #1E1E20; --surface-2: #252527; --fill: #3A3A3D; --text: #F5F5F7;
  --text-2: #98989D; --text-3: #6E6E73; --border: #38383A; --border-2: #48484A; --accent: #0A84FF;
  --selection: #0A6FE0; --accent-soft: #16324F; --accent-text: #64B5FF; --warn-bg: #3A2E12;
  --warn-border: #6B5420; --warn-text: #FFD60A; --success: #30D158; --danger: #FF453A;
  --segment-selected: #3A3A3D; --segment-outline: #48484A;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--surface); color: var(--text); font: 13px/1.45 var(--font);
  -webkit-font-smoothing: antialiased; display: flex; justify-content: center; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
main { width: 560px; max-width: calc(100% - 32px); margin-top: 22vh; align-self: flex-start;
  display: flex; flex-direction: column; gap: 22px; animation: rise .48s cubic-bezier(.16, 1, .3, 1); }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } }
@media (prefers-reduced-motion: reduce) { main { animation: none; } * { transition: none !important; } }

/* Segmented control: a fill track with a surface segment for the chosen mode. */
.modes { display: flex; align-self: center; padding: 2px; border-radius: 8px; background: var(--fill); }
.modes button { height: 24px; padding: 0 16px; border: 0; border-radius: 6px; background: transparent;
  color: var(--text); font-size: 13px; line-height: 24px; transition: background .16s; }
.modes button[aria-checked="true"] { background: var(--segment-selected); color: var(--text);
  box-shadow: inset 0 0 0 1px var(--segment-outline), 0 1px 3px rgba(0, 0, 0, .12); }

/* Search field: 44 px, with a 4 px accent halo while focused. */
.field { display: flex; align-items: center; height: 44px; padding: 0 6px 0 16px; border: 1px solid var(--border-2);
  border-radius: 10px; background: var(--surface); transition: box-shadow .16s; }
.field:focus-within { box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 18%, transparent); }
.field input { flex: 1; min-width: 0; height: 100%; border: 0; background: transparent; outline: none;
  font-size: 16px; }
.field input::placeholder { color: var(--text-3); }
.go { width: 32px; height: 32px; border-radius: 6px; border: 0; background: var(--selection); color: #FFFFFF;
  display: grid; place-items: center; flex: none; transition: opacity .16s; }
.go:disabled { opacity: .3; cursor: default; }
.go svg { width: 16px; height: 16px; }
.note { margin: -12px 0 0; min-height: 18px; color: var(--text-2); font-size: 12px; }

.research { margin: -10px 0 0; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px;
  background: var(--surface-2); font-size: 13px; display: flex; align-items: center; gap: 10px; }
.research .text { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.research .text b { font-weight: 600; }
.research.bad .text { color: var(--danger); }
.research .btn { border: 1px solid var(--border-2); background: var(--surface); border-radius: 6px;
  padding: 4px 10px; font-size: 12px; font-weight: 500; flex: none; }
.research .btn:hover { background: var(--fill); }
.spin { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--border-2);
  border-top-color: var(--text); animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Speed dial: six 56 px tiles at 78 px columns (560 px with 18 px gaps), labels 11 px. */
.tiles { display: flex; gap: 18px; padding-top: 14px; }
.tile { flex: none; width: 78px; display: flex; flex-direction: column; align-items: center; gap: 6px;
  padding: 0; border: 0; background: transparent; color: var(--text); }
.tile-plate { width: 56px; height: 56px; border-radius: 12px; background: var(--fill); color: var(--text-2);
  display: grid; place-items: center; font: 600 22px/1 var(--font); box-shadow: 0 1px 3px rgba(0,0,0,.15);
  transition: background .16s; }
.tile-plate svg { width: 24px; height: 24px; }
.tile:hover .tile-plate { background: var(--border-2); }
.tile-label { max-width: 78px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  font-size: 11px; line-height: 1.3; }

</style>
</head>
<body>
<main>
  <div class="modes" role="radiogroup" aria-label="Input mode" id="modes">
    <button type="button" role="radio" data-mode="search" aria-checked="true">Search</button>
    <button type="button" role="radio" data-mode="agent" aria-checked="false">Ask Agent</button>
    <button type="button" role="radio" data-mode="research" aria-checked="false">Research</button>
  </div>
  <form class="field" id="form" autocomplete="off">
    <input id="q" type="text" autofocus spellcheck="false" autocomplete="off" placeholder="Search with Google" aria-label="Search or ask the agent">
    <button class="go" id="go" type="submit" aria-label="Search" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
  </form>
  <p class="note" id="note" aria-live="polite"></p>
  <div class="research" id="research" role="status" hidden>
    <span class="spin" id="research-spin" aria-hidden="true"></span>
    <span class="text" id="research-text"></span>
    <button class="btn" id="research-action" type="button" hidden></button>
    <button class="btn" id="research-cancel" type="button" hidden>Cancel</button>
  </div>
  <div class="tiles" id="tiles" role="group" aria-label="Most visited" hidden></div>
</main>
<template id="globe"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/></svg></template>
<script>
"use strict";
(function () {
  var MESSAGE_PREFIX = "\u0001island:";
  var MODES = ["search", "agent", "research"];
  var state = { mode: "search", engine: "Google", research: null, tiles: [] };
  var dismissedSeq = 0;
  var input = document.getElementById("q");
  var go = document.getElementById("go");
  var note = document.getElementById("note");
  var panel = document.getElementById("research");
  var panelText = document.getElementById("research-text");
  var panelSpin = document.getElementById("research-spin");
  var panelAction = document.getElementById("research-action");
  var panelCancel = document.getElementById("research-cancel");
  var tiles = document.getElementById("tiles");
  var modes = Array.prototype.slice.call(document.querySelectorAll("#modes button"));
  var tilesKey = "";

  function post(message) { console.log(MESSAGE_PREFIX + JSON.stringify(message)); }

  var PLACEHOLDERS = { search: null, agent: "Ask about this tab or anything",
    research: "Research a question \u2014 you'll see the plan first" };
  var LABELS = { search: "Search", agent: "Ask Agent", research: "Research" };

  function renderResearch() {
    var r = state.research;
    var show = !!r && r.state && r.state !== "idle" && r.seq !== dismissedSeq;
    panel.hidden = !show;
    if (!show) return;
    var running = r.state === "running";
    panel.className = "research" + (r.state === "failed" || r.state === "not_installed" ? " bad" : "");
    panelSpin.hidden = !running;
    panelCancel.hidden = !running;
    panelText.textContent = "";
    if (running) {
      var label = document.createElement("b");
      label.textContent = "Researching: ";
      panelText.appendChild(label);
      panelText.appendChild(document.createTextNode(r.question || ""));
    } else if (r.state === "done") {
      var done = document.createElement("b");
      done.textContent = "Report ready: ";
      panelText.appendChild(done);
      panelText.appendChild(document.createTextNode(r.report_title || "Research report"));
    } else {
      panelText.textContent = r.message || "Research did not finish.";
    }
    var action = r.state === "done" ? "open_report" : r.state === "not_installed" ? "open_settings" : "";
    panelAction.hidden = !action;
    panelAction.setAttribute("data-action", action);
    panelAction.textContent = action === "open_report" ? "Open report" : "Open Settings";
  }

  // IPv4 and IPv6 literals name no site, so their plate is a neutral globe, not a digit.
  var IPV4_LITERAL = /^\d{1,3}(\.\d{1,3}){3}$/;
  function isIpLiteral(host) {
    return IPV4_LITERAL.test(host) || host.charAt(0) === "[" || host.indexOf(":") >= 0;
  }

  // The speed dial: a letter plate, not a fetched icon, and the site's title, ellipsized.
  // Built with DOM calls only: titles come from the web and stay text.
  function renderTiles() {
    var list = state.tiles;
    tiles.hidden = !list.length;
    var key = JSON.stringify(list);
    if (key === tilesKey) return;
    tilesKey = key;
    while (tiles.firstChild) tiles.removeChild(tiles.firstChild);
    list.forEach(function (tile) {
      var host = String(tile.host || "");
      var name = tile.title || host;
      var button = document.createElement("button");
      button.type = "button";
      button.className = "tile";
      button.title = name;
      button.setAttribute("aria-label", name);
      var plate = document.createElement("span");
      plate.className = "tile-plate";
      plate.setAttribute("aria-hidden", "true");
      if (isIpLiteral(host)) {
        plate.appendChild(document.getElementById("globe").content.firstElementChild.cloneNode(true));
      } else {
        var letter = /[a-z0-9]/i.exec(host.replace(/^www\./, ""));
        plate.textContent = letter ? letter[0].toUpperCase() : "";
      }
      var label = document.createElement("span");
      label.className = "tile-label";
      label.textContent = name;
      button.appendChild(plate);
      button.appendChild(label);
      button.addEventListener("click", function () { post({ type: "open_tile", url: tile.url }); });
      tiles.appendChild(button);
    });
  }

  function render() {
    modes.forEach(function (button) {
      var on = button.getAttribute("data-mode") === state.mode;
      button.setAttribute("aria-checked", on ? "true" : "false");
      button.tabIndex = on ? 0 : -1;
    });
    input.placeholder = PLACEHOLDERS[state.mode] || "Search with " + state.engine;
    go.setAttribute("aria-label", LABELS[state.mode]);
    go.disabled = !input.value.trim();
    renderResearch();
    renderTiles();
  }

  function setMode(mode, remember) {
    if (MODES.indexOf(mode) < 0) return;
    if (mode !== state.mode) {
      state.mode = mode;
      if (remember) post({ type: "set_start_mode", mode: mode });
    }
    note.textContent = "";
    render();
  }

  function submit() {
    var text = input.value.trim();
    if (!text) return;
    if (state.mode === "agent") {
      // The text stays until Island confirms the agent took it (islandAgentResult).
      post({ type: "ask_agent", prompt: text });
      note.textContent = "Sending to the agent...";
    } else if (state.mode === "research") {
      // Island answers through the research state (islandRender), keeping the text on a refusal.
      post({ type: "research", question: text });
      note.textContent = "Starting research...";
    } else {
      post({ type: "search", query: text });
    }
    render();
  }

  modes.forEach(function (button, index) {
    button.addEventListener("click", function () { setMode(button.getAttribute("data-mode"), true); input.focus(); });
    button.addEventListener("keydown", function (event) {
      var step = event.key === "ArrowRight" || event.key === "ArrowDown" ? 1
        : event.key === "ArrowLeft" || event.key === "ArrowUp" ? -1 : 0;
      if (!step) return;
      event.preventDefault();
      var next = modes[(index + step + modes.length) % modes.length];
      setMode(next.getAttribute("data-mode"), true);
      next.focus();
    });
  });
  // While the field has focus, Tab and Shift+Tab step through the modes (wrapping) and focus
  // stays in the field. Elsewhere Tab moves focus as usual.
  input.addEventListener("keydown", function (event) {
    if (event.key !== "Tab" || event.altKey || event.ctrlKey || event.metaKey || event.isComposing) return;
    event.preventDefault();
    var index = MODES.indexOf(state.mode);
    setMode(MODES[(index + (event.shiftKey ? -1 : 1) + MODES.length) % MODES.length], true);
    input.focus();
  });
  document.getElementById("form").addEventListener("submit", function (event) {
    event.preventDefault();
    if (!event.isComposing) submit();
  });
  input.addEventListener("input", function () {
    note.textContent = "";
    if (state.research && state.research.state !== "running") dismissedSeq = state.research.seq;
    render();
  });
  panelCancel.addEventListener("click", function () { post({ type: "cancel_research" }); });
  panelAction.addEventListener("click", function () {
    var action = panelAction.getAttribute("data-action");
    if (action) post({ type: action });
  });

  function applyTheme(theme) {
    if (!theme) return;
    var root = document.documentElement;
    ["bg", "surface", "surface-2", "text", "text-2", "border", "accent"].forEach(function (key) {
      var value = theme[key.replace("-", "_")];
      if (value) root.style.setProperty("--" + key, value);
    });
    [
      ["fill", "--fill"], ["border_2", "--border-2"], ["text_3", "--text-3"],
      ["selection", "--selection"], ["accent_soft", "--accent-soft"],
      ["accent_text", "--accent-text"], ["warn_bg", "--warn-bg"],
      ["warn_border", "--warn-border"], ["warn_text", "--warn-text"],
      ["success", "--success"], ["danger", "--danger"],
      ["segment_selected", "--segment-selected"]
    ].forEach(function (mapping) {
      var value = theme[mapping[0]];
      if (value) root.style.setProperty(mapping[1], value);
    });
    ["--branch-a", "--branch-b", "--branch-c", "--branch-d"].forEach(function (variable, index) {
      var value = theme.branch && theme.branch[index];
      if (value) root.style.setProperty(variable, value);
    });
    if (theme.font) root.style.setProperty("--font", theme.font);
    root.setAttribute("data-theme", theme.dark ? "dark" : "light");
  }

  window.islandRender = function (next) {
    if (next.theme) applyTheme(next.theme);
    if (next.start) {
      state.mode = MODES.indexOf(next.start.mode) >= 0 ? next.start.mode : "search";
      state.engine = next.start.engine || "Google";
      state.tiles = Array.isArray(next.start.tiles) ? next.start.tiles : [];
      var previous = state.research;
      state.research = next.start.research || null;
      var fresh = state.research && (!previous || previous.seq !== state.research.seq);
      if (fresh && state.research.state !== "idle") note.textContent = "";
      // Island took the question: the field is free for the next one.
      if (fresh && state.research.state === "running") input.value = "";
    }
    render();
  };
  window.islandFocus = function () { input.focus(); };
  window.islandNote = function (text) { note.textContent = text || ""; };
  window.islandAgentResult = function (sent) {
    if (sent) {
      input.value = "";
      note.textContent = "Sent to the agent. Follow along in the agent panel.";
    } else {
      note.textContent = "The agent is busy with another task. Try again when it finishes.";
    }
    render();
  };

  render();
  input.focus();
  post({ type: "ready" });
})();
</script>
</body>
</html>
