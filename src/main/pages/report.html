<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Report</title>
<style>
:root {
  --bg: #FAFAFA; --surface: #FFFFFF; --surface-2: #F2F2F2; --text: #0A0A0A; --text-2: #666666;
  --border: #E5E5E5; --accent: #0068D6; --accent-soft: color-mix(in srgb, var(--accent) 12%, transparent);
  --radius: 10px; --radius-sm: 6px;
  --font: Geist, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  color-scheme: light;
}
/* Before the first state arrives the page follows the system scheme; once the
   app sends its theme, data-theme wins so the page matches the app. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme]) { --bg: #0A0A0A; --surface: #111111; --surface-2: #1A1A1A;
    --text: #EDEDED; --text-2: #A1A1A1; --border: #2A2A2A; --accent: #3291FF; color-scheme: dark; }
}
:root[data-theme="dark"] { color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--surface); color: var(--text); font: 15px/1.65 var(--font);
  -webkit-font-smoothing: antialiased; display: flex; justify-content: center; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
main { width: 100%; max-width: 760px; padding: 40px 24px 96px; }
.label { margin: 0 0 10px; color: var(--text-2); font: 500 11px/1.4 var(--mono); letter-spacing: .08em;
  text-transform: uppercase; }
h1.title { margin: 0 0 6px; font-size: 28px; line-height: 1.2; letter-spacing: -.03em; font-weight: 650; }
.meta { margin: 0 0 18px; color: var(--text-2); font-size: 13px; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px 0 14px;
  border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); margin-bottom: 28px; }
.btn { border: 1px solid var(--border); background: var(--bg); border-radius: var(--radius-sm);
  padding: 6px 12px; font-size: 13px; font-weight: 500; transition: background .16s, border-color .16s; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--text); border-color: var(--text); color: var(--surface); }
.btn.primary:hover { opacity: .88; background: var(--text); }
.status { margin-left: auto; min-height: 20px; color: var(--text-2); font-size: 13px; }
/* Export menu: neutral raised rows, no accent fill */
.export { position: relative; }
.menu { position: absolute; top: calc(100% + 4px); left: 0; z-index: 2; min-width: 200px; padding: 4px;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm);
  box-shadow: 0 8px 24px rgba(0, 0, 0, .12); }
.menu button { display: block; width: 100%; text-align: left; border: 0; background: transparent;
  border-radius: 4px; padding: 6px 10px; font-size: 13px; }
.menu button:hover, .menu button:focus-visible { background: var(--surface-2); outline: none; }
.menu button:disabled { color: var(--text-2); cursor: default; background: transparent; }
.kind-icon { display: inline-block; width: 13px; height: 13px; margin-right: 6px; vertical-align: -2px; }
.status.bad { color: #CD2B31; }
.empty { color: var(--text-2); }
.empty .btn { margin-top: 12px; }

/* The report body: output of the shared Markdown renderer */
.doc { word-wrap: break-word; }
.doc p { margin: 0 0 14px; }
.doc h1, .doc h2, .doc h3, .doc h4, .doc h5, .doc h6 { margin: 28px 0 10px; line-height: 1.3;
  letter-spacing: -.02em; font-weight: 620; }
.doc h1 { font-size: 22px; } .doc h2 { font-size: 19px; } .doc h3 { font-size: 16.5px; }
.doc h4 { font-size: 15px; } .doc h5, .doc h6 { font-size: 14px; color: var(--text-2); }
.doc > :first-child { margin-top: 0; }
.doc ul, .doc ol { margin: 0 0 14px; padding-left: 22px; }
.doc li { margin: 4px 0; }
.doc li::marker { color: var(--text-2); }
.doc li > ul, .doc li > ol { margin: 4px 0; }
.doc li > p { margin: 0 0 6px; }
.doc blockquote { margin: 0 0 14px; padding: 2px 0 2px 16px; border-left: 3px solid var(--border);
  color: var(--text-2); }
.doc blockquote p { margin: 0 0 8px; }
.doc hr { border: 0; border-top: 1px solid var(--border); margin: 24px 0; }
.doc del { color: var(--text-2); }
.doc code { font: 13px/1.5 var(--mono); background: var(--surface-2); border: 1px solid var(--border);
  border-radius: 4px; padding: 0 5px; }
.doc pre { margin: 0 0 14px; padding: 12px 14px; overflow-x: auto; background: var(--bg);
  border: 1px solid var(--border); border-radius: var(--radius); }
.doc pre code { background: none; border: 0; padding: 0; }
.doc a { color: var(--accent); text-decoration: underline; text-decoration-color: var(--accent-soft);
  text-underline-offset: 2px; }
.doc a:hover { text-decoration-color: var(--accent); }
.doc .table-wrap { overflow-x: auto; margin: 0 0 16px; border: 1px solid var(--border);
  border-radius: var(--radius); }
.doc table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
.doc th, .doc td { padding: 8px 12px; text-align: left; border-top: 1px solid var(--border); vertical-align: top; }
.doc thead th { border-top: 0; background: var(--surface-2); font: 500 11px/1.4 var(--mono);
  letter-spacing: .06em; text-transform: uppercase; color: var(--text-2); }
.doc.plain { white-space: pre-wrap; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
/* Native look (N3): the kicker and table headers are sentence case, not mono uppercase. */
:root[data-look="native"] .label,
:root[data-look="native"] .doc thead th { font: 600 11px/1.4 var(--font); letter-spacing: 0; text-transform: none; }
</style>
</head>
<body>
<main>
  <p class="label" id="kind"><svg class="kind-icon" id="kind-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" hidden><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16"/></svg><span id="kind-text">Research report</span></p>
  <h1 class="title" id="title">Report</h1>
  <p class="meta" id="meta"></p>
  <div class="bar" role="toolbar" aria-label="Report actions">
    <button class="btn primary" id="copy" type="button">Copy Markdown</button>
    <div class="export" id="export-wrap">
      <button class="btn" id="export" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="export-menu">Export</button>
      <div class="menu" id="export-menu" role="menu" aria-label="Export the report" hidden>
        <button type="button" role="menuitem" id="export-csv" data-format="csv">CSV (.csv)</button>
        <button type="button" role="menuitem" id="export-json" data-format="json">JSON (.json)</button>
        <button type="button" role="menuitem" id="export-md" data-format="md">Markdown (.md)</button>
      </div>
    </div>
    <button class="btn" id="continue" type="button">Continue in agent panel</button>
    <span class="status" id="status" role="status" aria-live="polite"></span>
  </div>
  <article class="doc" id="doc" aria-label="Report"></article>
  <div class="empty" id="empty" hidden>
    <p>This report is no longer in your Reports list.</p>
  </div>
</main>
<script>
"use strict";
(function () {
  var MESSAGE_PREFIX = "\u0001island:";
  var state = { report: null };
  var doc = document.getElementById("doc");
  var statusLine = document.getElementById("status");
  var statusTimer = 0;
  var buttons = ["copy", "export", "continue"].map(function (id) { return document.getElementById(id); });
  var exportButton = document.getElementById("export");
  var exportMenu = document.getElementById("export-menu");

  function post(message) { console.log(MESSAGE_PREFIX + JSON.stringify(message)); }

  // @@ISLAND_MARKDOWN@@

  function say(text, bad) {
    statusLine.textContent = text || "";
    statusLine.className = bad ? "status bad" : "status";
    clearTimeout(statusTimer);
    if (text) statusTimer = setTimeout(function () { statusLine.textContent = ""; }, 4000);
  }

  // The page already shows the title as its H1, so the report's own first H1 goes when it says the
  // same thing (N3). Only the rendered view drops it; Copy and Export keep the full Markdown.
  function dropRepeatedTitle(title) {
    var heading = doc.querySelector("h1");
    var clean = function (text) { return String(text || "").replace(/\s+/g, " ").trim(); };
    if (heading && clean(title) && clean(heading.textContent) === clean(title)) heading.remove();
  }

  function dateLabel(ms) {
    if (!ms) return "";
    try { return new Date(ms).toLocaleString(); } catch (error) { return ""; }
  }

  function render() {
    var report = state.report;
    var has = !!report;
    document.getElementById("empty").hidden = has || !state.loaded;
    doc.hidden = !has;
    buttons.forEach(function (button) { button.disabled = !has; });
    if (!has) {
      setExportOpen(false);
      document.getElementById("title").textContent = "Report";
      document.getElementById("meta").textContent = "";
      doc.textContent = "";
      return;
    }
    document.title = report.title || "Report";
    document.getElementById("title").textContent = report.title || "Report";
    var when = dateLabel(report.created_ms);
    var meta = [];
    if (report.question) meta.push("Question: " + report.question);
    if (when) meta.push(when);
    document.getElementById("meta").textContent = meta.join("  |  ");
    var collection = report.kind === "collection";
    document.getElementById("kind-text").textContent = collection ? "Collected table" : "Research report";
    // SVG elements have no `hidden` property; toggle the attribute instead.
    document.getElementById("kind-icon").toggleAttribute("hidden", !collection);
    // A report without a table has no CSV or JSON to export.
    ["export-csv", "export-json"].forEach(function (id) {
      var item = document.getElementById(id);
      item.disabled = !report.has_table;
      item.title = report.has_table ? "" : "No table in this report";
    });
    // The renderer escapes all model text; if it throws, show the raw text.
    try {
      doc.innerHTML = islandMarkdown(report.markdown || "");
      doc.classList.remove("plain");
      dropRepeatedTitle(report.title);
    } catch (error) {
      doc.textContent = report.markdown || "";
      doc.classList.add("plain");
    }
  }

  // Links open in a new Island tab through native; only http(s) goes out.
  doc.addEventListener("click", function (event) {
    var link = event.target && event.target.closest ? event.target.closest("a[href]") : null;
    if (!link || !doc.contains(link)) return;
    event.preventDefault();
    var href = link.getAttribute("href") || "";
    if (/^https?:\/\//i.test(href)) post({ type: "open_url", url: href });
  });

  function act(type, format) {
    if (!state.report) return;
    var message = { type: type, id: state.report.id };
    if (format) message.format = format;
    post(message);
  }
  function setExportOpen(open) {
    exportMenu.hidden = !open;
    exportButton.setAttribute("aria-expanded", open ? "true" : "false");
  }
  document.getElementById("copy").addEventListener("click", function () { act("copy_report"); });
  exportButton.addEventListener("click", function () {
    if (state.report) setExportOpen(exportMenu.hidden);
  });
  exportMenu.addEventListener("click", function (event) {
    var item = event.target && event.target.closest ? event.target.closest("button[data-format]") : null;
    if (!item || item.disabled) return;
    setExportOpen(false);
    act("export", item.getAttribute("data-format"));
  });
  document.addEventListener("click", function (event) {
    if (!document.getElementById("export-wrap").contains(event.target)) setExportOpen(false);
  });
  document.addEventListener("keydown", function (event) {
    if (event.key === "Escape") setExportOpen(false);
  });
  document.getElementById("continue").addEventListener("click", function () { act("continue_in_agent"); });

  function applyTheme(theme) {
    if (!theme) return;
    var root = document.documentElement;
    ["bg", "surface", "surface-2", "text", "text-2", "border", "accent"].forEach(function (key) {
      var value = theme[key.replace("-", "_")];
      if (value) root.style.setProperty("--" + key, value);
    });
    [
      ["fill", "--fill"], ["border_2", "--border-2"], ["text_3", "--text-3"],
      ["selection", "--selection"], ["accent_soft", "--accent-soft"],
      ["accent_text", "--accent-text"], ["warn_bg", "--warn-bg"],
      ["warn_border", "--warn-border"], ["warn_text", "--warn-text"],
      ["success", "--success"], ["danger", "--danger"]
    ].forEach(function (mapping) {
      var value = theme[mapping[0]];
      if (value) root.style.setProperty(mapping[1], value);
    });
    ["--branch-a", "--branch-b", "--branch-c", "--branch-d"].forEach(function (variable, index) {
      var value = theme.branch && theme.branch[index];
      if (value) root.style.setProperty(variable, value);
    });
    root.setAttribute("data-theme", theme.dark ? "dark" : "light");
    root.setAttribute("data-look", theme.look || "");
  }

  window.islandRender = function (next) {
    if (next.theme) applyTheme(next.theme);
    if (next.hasOwnProperty("report")) {
      state.report = next.report || null;
      state.loaded = true;
    }
    render();
    // Dev capture (report_fixture:collection) asks for the Export menu to be open.
    if (next.open_export && state.report) setExportOpen(true);
  };
  window.islandFocus = function () { document.getElementById("copy").focus(); };
  // Native reports how copy / save went: "copied", "saved", "cancelled" or an error text.
  window.islandReportResult = function (kind, text) {
    if (kind === "copied") say("Markdown copied.");
    else if (kind === "saved") say(text ? "Saved to " + text : "Saved.");
    else if (kind === "cancelled") say("");
    else say(text || "That did not work.", true);
  };

  render();
  post({ type: "ready" });
})();
</script>
</body>
</html>
